# Run the web application against the persistent database stack from dspa-mcp.
# Start that stack first so its external database network exists.
# Use the matched db-webapp image built with that stack's service credentials:
#   docker compose --env-file ../dspa-mcp/.env -f docker-compose-db.yml up -d
name: dspa-main-db

services:
  webapp:
    image: ${DSPA_DB_WEBAPP_IMAGE:-registry.ethz.ch/maudrius/dspa-mcp/db-webapp:latest}
    container_name: ${DSPA_MAIN_CONTAINER_NAME:-dspa_main_db}
    platform: ${DSPA_MAIN_PLATFORM:-linux/amd64}
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_HOST: database
      DB_USER: dspa_backend_reader
      DB_NAME: app
      DB_USER_CONTEXT_MODE: per-user
      DB_PORT: 3306
      UNIPROT_CACHE_DIR: ./cache/dspatlas
      UNIPROT_CACHE_MAX_BYTES: 67108864
      UNIPROT_CACHE_TTL_MS: 2592000000
    ports:
      - "${DSPA_MAIN_HTTP_HOST:-127.0.0.1}:${DSPA_MAIN_HTTP_PORT:-8080}:8080"
    networks:
      public:
        gw_priority: 1
      database_access:
        gw_priority: 0
      webapp_http:
        gw_priority: 0
    volumes:
      - type: bind
        source: ./cache
        target: /usr/src/app/cache
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/v1/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  webapp_http:
    name: ${DSPA_WEBAPP_HTTP_NETWORK:-dspa-mcp-db-devel_webapp_http}
    external: true
  public:
    driver: bridge
  database_access:
    name: ${DSPA_DB_WEBAPP_NETWORK:-dspa-mcp-db-devel_database_webapp}
    external: true
