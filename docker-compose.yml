services:
  webapp:
    image: dynaprot/dspa-main-app:latest
    restart: unless-stopped
    networks:
      webnet:
      edge:
        aliases:
          - dspa_public_webapp
    depends_on:
      - db
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=3306
      - UNIPROT_CACHE_DIR=./cache/dspatlas
      - UNIPROT_CACHE_MAX_BYTES=67108864
      - UNIPROT_CACHE_TTL_MS=2592000000
      - USERNAME_WEBSITE=
      - PASSWORD_WEBSITE=
    volumes:
      - ./cache:/app/cache
  db:
    image: mysql:8.0
    restart: always
    networks:
      - webnet
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # This would create database as per this script if the volume is missing
      - ./dynaprotdb.sql:/docker-entrypoint-initdb.d/dynaprotdb.sql

networks:
  webnet:
    external: true
  edge:
    name: ${DSPA_EDGE_NETWORK:-dspa_edge}
    external: true

volumes:
  mysql-data:
